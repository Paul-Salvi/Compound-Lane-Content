/* ============================================================
   ANIMATION LANE — whiteboard reveals
   Clips live inside #root and MUST be direct children (HyperFrames contract).
   Static chrome (.desk-shadow, .notebook-page, header, footer) is the first
   child of #root and paints the notebook-page surface (z-index: 0). Each
   timed section sits ABOVE the chrome (z-index: 1) at a distinct vertical
   offset (clearing the header). The result: a single notebook page where
   each new section is "written" into the next line down as the timeline
   advances, and previously-revealed sections stay drawn underneath — the
   "whiteboard" feel. At the end, the rendered video matches the static
   02-visual PNG (all sections visible in a vertical stack on the same page).
   ============================================================ */

#root {
  position: relative;
  width: 1080px;
  height: 1920px;
}

/* Static visual chrome lives inside #root as the FIRST child so the timed
   sections paint on top. It carries data-hf-static so the linter/renderer
   knows it isn't a clip. */
.notebook-chrome {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  flex-direction: column;
  pointer-events: none;
}
.notebook-chrome > * { pointer-events: auto; }

/* Each timed section is a direct child of #root, absolutely positioned so
   it sits in the notebook-page content area (z-index: 1, on top of the
   chrome). The `top` is set INLINE per-section by the build script — each
   section gets a distinct vertical offset so the six sections stack into
   a vertical column rather than overlapping. The notebook-page has 22px
   top padding, header has ~12px margin, kicker is ~28px tall, h1 wraps to
   ~150px — so the first section's top is 210px (just below the H1). */
.clip-section {
  position: absolute;
  z-index: 1;
  width: var(--content);
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  padding: 0;
}

/* Per-element reveal stagger — driven by --draw-delay set inline by the build script */
[data-draw-delay] {
  animation-delay: var(--draw-delay, 0s);
  animation-fill-mode: both;
}

/* 1) SVG marker stroke draw — uses pathLength="1" on the path,
   so a single dasharray:1 normalizes any path length. */
.ink-stroke path,
.ink-stroke line,
.ink-stroke polyline,
.ink-stroke polygon,
.ink-stroke rect,
.ink-stroke circle,
.ink-stroke ellipse {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: ink-draw var(--draw-dur, 0.45s) ease-out forwards;
}
@keyframes ink-draw { to { stroke-dashoffset: 0; } }

/* The fill-only polygon arrowhead on .flow-arrow fades in after the path draws. */
.arrow-head-pop {
  opacity: 0;
  animation: fade-in 0.20s ease-out forwards;
  animation-delay: var(--draw-delay, 0.30s);
}

/* 2) Text fade-in (Caveat/Patrick Hand are rasterized — never scale or translate per-letter). */
.draw-fade {
  opacity: 0;
  animation: fade-in 0.20s ease-out forwards;
}
@keyframes fade-in { to { opacity: 1; } }

/* 3) .num-blob pop — scale-bounce, NOT a stroke draw (border-radius shapes are not SVG). */
.draw-pop {
  opacity: 0;
  transform: scale(0.6);
  transform-origin: center;
  animation: pop-in 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes pop-in {
  0%   { opacity: 0; transform: scale(0.6); }
  60%  { opacity: 1; transform: scale(1.06); }
  100% { opacity: 1; transform: scale(1); }
}

<!-- HyperFrames composition root. Must be a direct child of <body>.
     Static chrome (.desk-shadow, .notebook-page, header, footer) lives as the
     first child inside #root so the timed sections paint on top of it. -->
<div data-hf-id="hf-{{COMPOSITION_ID}}" id="root" data-composition-id="{{COMPOSITION_ID}}" data-start="0" data-width="1080" data-height="1920" data-duration="{{TOTAL_DURATION}}">
  <div class="notebook-chrome" aria-hidden="false" data-hf-static="chrome" data-layout-allow-overlap data-layout-allow-occlusion>
    <div class="desk-shadow"><div class="notebook-page paper-grain">
      <div class="watermark"><svg viewBox="0 0 96 96" pathLength="1"><path d="M10 76 L32 76 L32 58 L50 58 L50 40 L68 40 L68 24 L86 24 L86 16" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs><filter id="rough-a" x="-6%" y="-10%" width="112%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="rough-b" x="-6%" y="-10%" width="112%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.15" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="rough-c" x="-6%" y="-10%" width="112%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="29" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
      <header class="ink"><div class="brand"><b>@compoundlane</b> &middot; notes</div><span class="kicker rough2">{{KICKER}}<svg viewBox="0 0 300 10" preserveAspectRatio="none" pathLength="1"><path class="ink-stroke" d="M2,6 Q40,2 80,6 T160,5 T240,7 T298,4" fill="none" stroke-width="2" stroke-linecap="round"/></svg></span><h1>{{H1}}</h1></header>
      <footer class="ink"><div class="source">{{SOURCE_FOOTER}}</div><a href="https://www.compoundlane.com">compoundlane.com</a></footer>
    </div></div>
  </div>

  {{SECTIONS}}

  <!-- BGM bed (track 10) — omitted when audio is disabled -->
  {{BED_AUDIO}}

  <!-- SFX scribbles — one per section, no overlap, tracks 12..(12+N-1) -->
  {{SFX_AUDIO}}
</div>

<!-- ─── TIMELINE ───────────────────────────────────────────────
     Only the BGM volume envelope. CSS keyframes do all visual work.
     Paused and registered on window.__timelines["{{COMPOSITION_ID}}"]. -->
<script>
window.__timelines = window.__timelines || {};
const bed = document.getElementById("bed");
const intro_s = {{INTRO_S}};
const outro_s = {{OUTRO_S}};
const total   = {{TOTAL_DURATION}};
const tl = gsap.timeline({ paused: true });
const db2lin = (db) => Math.pow(10, db / 20);
if (bed) {
  bed.volume = db2lin(-40);
  // fade in over the intro
  tl.to(bed, { volume: db2lin(-8),  duration: 1.0, ease: "power1.out" }, 0.0);
  // hold steady, then fade out over the outro
  tl.to(bed, { volume: db2lin(-8),  duration: Math.max(0.1, total - outro_s - 1.0), ease: "none" }, 1.0);
  tl.to(bed, { volume: db2lin(-40), duration: Math.min(outro_s, 1.0),                ease: "power1.in"  }, total - outro_s);
}
// Always register the timeline, even if bed is absent — the framework expects it.
window.__timelines["{{COMPOSITION_ID}}"] = tl;
</script>
