<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Dollar-Cost Averaging: Does It Work? — Compound Lane</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body {
        margin: 0;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: oklch(97.5% .008 85);
      }
      /* Page background: frozen notebook page. */
      #page-bg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        background-image: url("public/page-background.png");
        background-size: 1080px 1920px;
        background-repeat: no-repeat;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ir4y" id="root" data-composition-id="dca-explainer" data-start="0" data-width="1080" data-height="1920" data-duration="144.0">
      <!-- Page background: visible the full 144.0s. -->
      <div data-hf-id="hf-5alv" id="page-bg" class="clip" data-start="0" data-duration="144.0" data-track-index="0"></div>

      <!-- ─── AUDIO TRACKS ───────────────────────────────────────
           Single voiceover track (intro + 6 concepts + outro,
           generated as one stream from 02-audio/tts_script.txt).
           Music bed runs the full 144.0s and is ducked by the
           volume envelope in the script. -->

      <!-- Music bed (track 10) -->
      <audio data-hf-id="hf-ubz5" id="bed" data-start="0" data-duration="144.0" data-track-index="10" data-volume="0.4" src=".media/music/bed.mp3"></audio>

      <!-- Voiceover (track 11) — single combined file -->
      <audio data-hf-id="hf-vo1" id="vo" data-start="0" data-duration="143.73" data-track-index="11" data-volume="1" src=".media/voiceover/voiceover.mp3"></audio>
    </div>

    <!-- ─── TIMELINE ───────────────────────────────────────────────
         No motion. Just the page background, voiceover, and music.
         The timeline only drives the music bed's volume envelope
         (fade in, duck under each VO block, fade out). Paused and
         registered on window.__timelines["dca-explainer"]. -->

    <script>
      window.__timelines = window.__timelines || {};
      const bed = document.getElementById("bed");
      const tl  = gsap.timeline({ paused: true });

      // dB to linear gain. 0dB = 1, -8dB ≈ 0.398, -16dB ≈ 0.158, -40dB ≈ 0.01
      const db2lin = (db) => Math.pow(10, db / 20);

      // ── MUSIC BED ENVELOPE ─────────────────────────────────────
      // Start silent, fade in 0→1s, duck under the single VO stream,
      // unduck 142→143s, fade out 143→144s.
      if (bed) {
        bed.volume = db2lin(-40);
        // Fade in 0→1s
        tl.to(bed, { volume: db2lin(-8),  duration: 1.0, ease: "power1.out" }, 0.0);
        // Duck under the entire VO (which runs 0–143.7s)
        tl.to(bed, { volume: db2lin(-16), duration: 1.0, ease: "power1.out" }, 1.0);
        // Unduck after VO ends
        tl.to(bed, { volume: db2lin(-8),  duration: 1.0, ease: "power1.out" }, 142.0);
        // Fade out 143→144s
        tl.to(bed, { volume: db2lin(-40), duration: 1.0, ease: "power1.in" }, 143.0);
      }

      window.__timelines["dca-explainer"] = tl;
    </script>
  </body>
</html>
